{% extends 'base.html' %}
{% block title %}500 服务器错误 · 云栖酒店{% endblock %}
{% block page_title %}500 · 服务器内部错误{% endblock %}
{% block breadcrumb_current %}服务器错误{% endblock %}
{% block content %}
<div class="error-page">
  <h2 class="headline text-danger">500</h2>
  <div class="error-content">
    <h3><i class="fas fa-bug text-danger mr-1"></i>服务器处理请求时出错了</h3>
    <p>请求已被记录。若正在演示，请回到首页重试，并把操作步骤与时间告诉值班同学。</p>
    <p class="mb-0">
      <a href="{% url 'core:customer_home' %}" class="btn btn-primary btn-sm"><i class="fas fa-home mr-1"></i>返回首页</a>
    </p>
  </div>
</div>
{% endblock %}
