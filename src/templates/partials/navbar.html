{% load static %}
<nav class="main-header navbar navbar-expand navbar-white navbar-light">
  <ul class="navbar-nav">
    <li class="nav-item">
      <a class="nav-link" data-widget="pushmenu" href="#" role="button" aria-label="切换侧边栏">
        <i class="fas fa-bars"></i>
      </a>
    </li>
    <li class="nav-item d-none d-sm-inline-block">
      <span class="nav-link font-weight-bold text-dark">云栖酒店客房预订与入住管理系统</span>
    </li>
  </ul>

  <ul class="navbar-nav ml-auto">
    <li class="nav-item d-none d-md-inline-block">
      <span class="nav-link text-muted">
        <i class="far fa-calendar-alt mr-1"></i>{% now "Y-m-d" %}
      </span>
    </li>
    <li class="nav-item dropdown">
      <a class="nav-link dropdown-toggle" href="#" id="userMenu" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
        <i class="fas fa-user-circle mr-1"></i>{{ user.get_full_name }}
        <span class="badge badge-info ml-1">{{ current_role_label }}</span>
      </a>
      <div class="dropdown-menu dropdown-menu-right" aria-labelledby="userMenu">
        <span class="dropdown-item-text text-muted small">
          {{ user.username }}{% if user.phone %} · {{ user.phone }}{% endif %}
        </span>
        <div class="dropdown-divider"></div>
        <form method="post" action="{% url 'core:logout' %}" class="px-3 py-1">
          {% csrf_token %}
          <button type="submit" class="btn btn-outline-danger btn-sm btn-block">
            <i class="fas fa-sign-out-alt mr-1"></i>退出登录
          </button>
        </form>
      </div>
    </li>
  </ul>
</nav>
