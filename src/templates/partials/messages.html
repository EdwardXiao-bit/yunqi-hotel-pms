{% if messages %}
  <div class="messages">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
        {% if message.tags == 'success' %}<i class="fas fa-check-circle mr-1"></i>{% endif %}
        {% if message.tags == 'danger' %}<i class="fas fa-exclamation-circle mr-1"></i>{% endif %}
        {% if message.tags == 'warning' %}<i class="fas fa-exclamation-triangle mr-1"></i>{% endif %}
        {% if message.tags == 'info' %}<i class="fas fa-info-circle mr-1"></i>{% endif %}
        {{ message }}
        <button type="button" class="close" data-dismiss="alert" aria-label="关闭">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
    {% endfor %}
  </div>
{% endif %}
